; AthenaOS — Waveshare ESP32-S3-Touch-AMOLED-1.8 (368x448)
; Build/flash (WSL): bash ./build_flash.sh [--env NAME]
;
; Envs:
;   waveshare_amoled_18     V1 SH8601 + FT3168
;   waveshare_amoled_18_v2  V2 CO5300 + CST820

[platformio]
src_dir = .
include_dir = firmware/include
default_envs = waveshare_amoled_18

[athena]
; 54.03.21-2 = Arduino 3.2.1 / IDF 5.4.2. Needed vs TamaFi's 53.03.13 (Arduino 3.1.3):
; I2S+PSRAM GDMA callback must live in internal RAM (arduino-esp32#11004, fixed in 3.2.0-RC2).
; Do not use custom_sdkconfig: HybridCompile ignores src_filter and breaks this tree.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
lib_deps =
	moononournation/GFX Library for Arduino@^1.6.0
	bitbank2/JPEGDEC@^1.8.0
build_src_filter =
	-<*>
	+<firmware/src/*.cpp>
	+<apps/launcher/*.cpp>
	+<apps/tamafi/*.cpp>
	+<apps/xiaozhi/*.cpp>
	+<apps/settings/*.cpp>
build_flags =
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=0
	-std=gnu++17
	-Ifirmware/include
	-Iapps/tamafi
extra_scripts =
	pre:scripts/embed_web.py

[env:waveshare_amoled_18]
extends = athena
build_src_filter = ${athena.build_src_filter}
build_flags =
	${athena.build_flags}
	-DBOARD_WAVESHARE_AMOLED_18

[env:waveshare_amoled_18_v2]
extends = athena
build_src_filter = ${athena.build_src_filter}
build_flags =
	${athena.build_flags}
	-DBOARD_WAVESHARE_AMOLED_18_V2
