<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AthenaOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <img class="mark" src="/logo.jpg" alt="" width="40" height="40">
  <div>
    <b>AthenaOS</b>
    <span id="meta"></span>
  </div>
</header>
<nav>
  <a href="#apps" data-i18n="navApps">Apps</a>
  <a href="#settings" data-i18n="navSettings">Settings</a>
  <a href="#install" data-i18n="navInstall">Install</a>
  <a href="#serial" data-i18n="navSerial">Serial</a>
</nav>
<main>
  <section id="apps">
    <div id="sys"></div>
    <table>
      <thead><tr><th data-i18n="thApp">App</th><th data-i18n="thState">State</th><th></th></tr></thead>
      <tbody id="appRows"></tbody>
    </table>
  </section>
  <section id="settings" hidden>
    <p id="wifiState"></p>
    <p id="wifiGuide" hidden></p>
    <label><span data-i18n="volume">Volume</span> <span id="volVal">70</span>%</label>
    <input id="vol" type="range" min="0" max="100" value="70">
    <label data-i18n="brightness">Brightness</label>
    <select id="bri">
      <option value="0">Low</option>
      <option value="1" selected>Mid</option>
      <option value="2">High</option>
    </select>
    <label data-i18n="language">Language</label>
    <select id="lang">
      <option value="en">English</option>
      <option value="it">Italiano</option>
    </select>
    <label data-i18n="wifi">WiFi</label>
    <button id="wifiBtn" type="button">On</button>
    <label data-i18n="hotspot">Hotspot</label>
    <button id="apBtn" type="button">Off</button>
    <p id="apState"></p>
    <label data-i18n="ssid">SSID</label>
    <input id="ssid" type="text" maxlength="32" autocomplete="off">
    <label data-i18n="password">Password</label>
    <input id="pass" type="password" maxlength="64" placeholder="leave empty to keep">
    <button id="wifiSave" type="button" data-i18n="wifiSave">Save WiFi</button>
    <p><a href="/setup" data-i18n="setupLink">Open WiFi setup</a></p>
    <label data-i18n="timezone">Timezone</label>
    <select id="tz">
      <option value="Rome" selected>Rome</option>
      <option value="UTC">UTC</option>
      <option value="London">London</option>
      <option value="NewYork">New York</option>
      <option value="Tokyo">Tokyo</option>
    </select>
    <p id="ntpState"></p>
    <label data-i18n="ntp">NTP</label>
    <button id="ntpBtn" type="button">On</button>
    <button id="reboot" type="button" data-i18n="reboot">Restart</button>
    <button id="poweroff" class="kill" type="button" data-i18n="poweroff">Power off</button>
    <button id="factory" class="kill" type="button" data-i18n="factory">Factory reset</button>
  </section>
  <section id="install" hidden>
    <p><span data-i18n="installHint">Sideload is not available yet. API:</span> <code>POST /api/apps/install</code></p>
    <input id="pkg" type="file">
  </section>
  <section id="serial" hidden>
    <pre id="serialOut"></pre>
  </section>
</main>
<p id="toast" hidden></p>
<script src="/app.js"></script>
</body>
</html>
